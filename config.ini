; =====================================================================
;  GoalTrick - Archivo de configuración
;  Cambia estos valores según tu servidor. Los cambios se aplican
;  inmediatamente (no hace falta reiniciar nada).
; =====================================================================

[database]
host     = "127.0.0.1"
port     = 3306
name     = "goaltrick"
user     = "root"
password = ""
charset  = "utf8mb4"

[app]
; Nombre que se muestra en la web
site_name         = "GoalTrick"
; URL base. Déjalo vacío para que se detecte automáticamente
; (ejemplo manual: "http://localhost/goaltrick")
base_url          = ""
timezone          = "America/Bogota"
; Muestra errores detallados (ponlo en false en producción)
debug             = true
currency          = "€"
; Idioma por defecto de la web (archivo lang/<código>.php): "es" o "en"
language          = "es"
; Usar el idioma del navegador para los visitantes que aún no han elegido uno
detect_browser_language = true
session_name      = "GOALTRICKSESSID"
; Días que dura el "Recordarme" del inicio de sesión
remember_days     = 30
; Permitir que nuevos usuarios se registren
registration_open = true

[game]
; Nombre del país principal (id 1 en la tabla countries)
country_name      = "Panamá"
; Divisiones de la liga del país principal (1 serie en la I, 4 en la II, 16 en la III...)
; 3 divisiones = 21 series = 168 equipos | 4 divisiones = 85 series = 680 equipos
divisions         = 3
; Divisiones de la liga de cada uno de los demás países (sección «Naciones»)
; 1 = 8 equipos | 2 = 40 equipos | 3 = 168 equipos por país
other_country_divisions = 2
; Dinero inicial de cada equipo nuevo
starting_cash     = 300000
; Días de la semana: 1 = lunes ... 7 = domingo. Horas en formato HH:MM
friendly_weekday  = 3
friendly_time     = "20:00"
training_weekday  = 4
training_time     = "06:00"
economy_weekday   = 5
economy_time      = "06:00"
league_weekday    = 6
league_time       = "18:00"
; Ejecuta las tareas pendientes (partidos, entrenamiento...) cuando alguien visita
; la web. Si usas el Programador de tareas / cron con cron/run.php puedes ponerlo en false.
auto_update       = true
; Multiplicador de la velocidad de entrenamiento (1.0 = normal)
training_speed    = 1.0
; Duración de una subasta en el mercado de fichajes (horas)
transfer_hours    = 72
; Incremento mínimo de una puja sobre la anterior (%)
min_bid_increment = 5
; Si se puja en los últimos X minutos, la subasta se alarga X minutos
bid_extension_minutes = 3
; Máximo de jugadores por plantilla
max_players       = 40
; Mínimo de jugadores para poder vender
min_players       = 15
; Los equipos controlados por la máquina compran y venden jugadores
bots_use_market   = true
; Semanas por temporada (14 jornadas de liga + 2 de descanso)
season_weeks      = 16

[worldcup]
; Mundial de selecciones: 32 naciones, 8 grupos de 4, octavos, cuartos, semifinales y final (7 semanas).
; Cada selección convoca a los jugadores de su nacionalidad con mayor TSI en cada posición.
enabled          = true
; Cada cuántas temporadas se juega (1 = todas las temporadas, 2 = una sí y otra no...)
every_seasons    = 1
; Semana de la temporada en la que se juega la 1ª jornada (se juegan 6 semanas seguidas)
start_week       = 3
; Día y hora de los partidos del Mundial (1 = lunes ... 7 = domingo)
weekday          = 2
time             = "20:00"
; Premio en dinero para el club de cada jugador por cada partido jugado con su selección
club_bonus       = 5000

[cup]
; Copa de liga: todos los equipos de cada país a eliminación directa, en la fecha de los amistosos.
; Los equipos que siguen vivos en la copa no pueden jugar amistosos.
enabled        = true
; Prima para el ganador de cada eliminatoria
round_prize    = 8000
winner_prize   = 150000
runnerup_prize = 60000

[sponsors]
; Patrocinio principal: antes de cada temporada cada club recibe 3 ofertas de empresas.
; Ingreso semanal base según la división en la que juega el equipo (1 = primera división)
base_level_1      = 40000
base_level_2      = 25000
base_level_3      = 15000
base_level_4      = 10000
base_level_5      = 7000
; Días que tiene un mánager para elegir oferta si se incorpora con la temporada empezada
offer_days        = 3
; Publicidad estática: ingreso semanal por socio (además del patrocinador principal)
ads_per_fan       = 4

[economy]
; Precio de las entradas por tipo de localidad
price_terraces    = 7
price_basic       = 10
price_roof        = 19
price_vip         = 35
; Mantenimiento semanal por asiento
maint_terraces    = 0.5
maint_basic       = 0.7
maint_roof        = 1.0
maint_vip         = 2.5
; Coste de construcción por asiento nuevo
build_terraces    = 45
build_basic       = 75
build_roof        = 90
build_vip         = 300
; Coste fijo de cualquier obra y coste por asiento demolido
build_fixed_cost  = 10000
demolish_cost     = 6
; Días que tarda una ampliación del estadio
build_days        = 7
; Salario semanal de cada miembro del personal
staff_wage        = 1800
; Coste de contratar un entrenador = trainer_hire_cost * nivel^2
trainer_hire_cost = 15000
; Inversión semanal de la cantera por nivel (0..3)
youth_cost        = 5000
; Premios de fin de temporada por posición (1º..8º), se multiplican
; por un factor según la división
prize_1           = 150000
prize_2           = 100000
prize_3           = 75000
prize_4           = 50000
prize_5           = 40000
prize_6           = 30000
prize_7           = 20000
prize_8           = 15000

[mail]
; Envío de correos para recuperar la contraseña (usa la función mail() de PHP,
; que en XAMPP necesita configurar sendmail/SMTP en php.ini).
; Si está desactivado, el administrador puede generar enlaces de recuperación.
enabled = false
from    = "no-reply@goaltrick.local"

[security]
; Intentos fallidos de inicio de sesión antes de bloquear
max_login_attempts = 5
lockout_minutes    = 15
; Clave para ejecutar las tareas por URL: index.php?page=cron&key=ESTA_CLAVE
cron_key           = "cambia-esta-clave-secreta"
